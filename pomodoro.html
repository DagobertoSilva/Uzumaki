<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Planejador de Estudos - Timer</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>

body{
    background:#f5f7fb;
    font-family:'Segoe UI',sans-serif;
}

header{
    background:#fff;
    border-bottom:1px solid #e9ecef;
}

.logo{
    font-size:2rem;
    font-weight:700;
}

.subtitle{
    color:#6c757d;
}

.nav-link{
    color:#495057;
    font-weight:500;
    margin-right:20px;
}

.nav-link.active{
    color:#2563eb !important;
    border-bottom:3px solid #2563eb;
}

.card-custom{

    background:#fff;
    border:none;
    border-radius:16px;
    box-shadow:0 2px 12px rgba(0,0,0,.08);

}

.timer{

    font-size:6rem;
    font-weight:700;
    color:#0f172a;

}

.progress{

    height:10px;
    width:450px;
    margin:auto;
    border-radius:10px;

}

.info{

    color:#6c757d;
    font-size:1.05rem;

}

.btn-start{

    width:320px;

}

.btn-reset{

    width:120px;

}

</style>

</head>

<body>

<header class="p-4">

<div class="container-fluid">

<div class="logo">
📚 Planejador de Estudos Inteligente
</div>

<div class="subtitle">
Organize seus estudos e alcance seus objetivos
</div>

<ul class="nav mt-4">

<li class="nav-item">
<a class="nav-link" href="index.html">
<i class="bi bi-graph-up"></i>
Dashboard
</a>
</li>

<li class="nav-item">
<a class="nav-link" href="materias.html">
<i class="bi bi-book"></i>
Matérias
</a>
</li>

<li class="nav-item">
<a class="nav-link" href="tarefas.html">
<i class="bi bi-check2-square"></i>
Tarefas
</a>
</li>

<li class="nav-item">
<a class="nav-link active" href="pomodoro.html">
<i class="bi bi-clock"></i>
Timer
</a>
</li>

</ul>

</div>

</header>

<div class="container-fluid mt-4">

<div class="card card-custom p-4">

<h2 class="mb-5">

Pomodoro Timer

</h2>

<div class="text-center">

<div class="timer">

25:00

</div>

<div class="progress mb-4">

<div class="progress-bar bg-primary"
style="width:0%">
</div>

</div>

<div class="mx-auto" style="max-width:450px;">

<label class="form-label fw-semibold">

Matéria:

</label>

<select class="form-select form-select-lg">

<option>Cálculo I</option>
<option>Física</option>
<option>Programação</option>

</select>

</div>

<div class="mt-4 d-flex justify-content-center gap-3">

<button class="btn btn-primary btn-lg btn-start">

<i class="bi bi-play-fill"></i>

Iniciar

</button>

<button class="btn btn-secondary btn-lg btn-reset">

<i class="bi bi-arrow-clockwise"></i>

Resetar

</button>

</div>

<div class="mt-5 info">

🍅 Técnica Pomodoro:
<strong>25 minutos de foco intenso</strong>

</div>

<div class="info">

O tempo será automaticamente registrado na matéria selecionada.

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
